  <style>

    @font-face {
      font-family: "TH Sarabun New";
      src: local("TH Sarabun New"), local("THSarabunNew"), local("TH SarabunPSK");
      font-display: block;
    }

    :root {
      --primary: #166534;
      --primary-2: #22c55e;
      --surface: rgba(255,255,255,.92);
      --bg: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --danger: #dc2626;
      --warning: #d97706;
      --shadow: 0 12px 32px rgba(15, 23, 42, .10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: "Prompt", sans-serif; color: var(--text); }
    body {
      background:
        radial-gradient(circle at 0 0, rgba(34,197,94,.14), transparent 34%),
        radial-gradient(circle at 100% 0, rgba(14,165,233,.12), transparent 30%),
        var(--bg);
    }

    .app-shell { min-height: 100vh; display: block; }
    body.authenticated .app-shell { display: block; }

    .login-screen {
      position: fixed; inset: 0; z-index: 6000; display: none; place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 10% 10%, rgba(34,197,94,.18), transparent 32%),
        radial-gradient(circle at 90% 0, rgba(14,165,233,.14), transparent 30%),
        #f1f5f9;
    }
    .login-screen.open { display: grid; }
    body.authenticated .login-screen { display: none; }
    .login-card {
      width: min(430px, 94vw); background: white; border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px; box-shadow: 0 28px 70px rgba(15,23,42,.18); overflow: hidden;
    }
    .login-head {
      position: relative;
      padding: 24px 54px 24px 26px; color: white; background: linear-gradient(120deg, #14532d, #166534 58%, #0f766e);
    }
    .login-close {
      position:absolute; top:14px; right:16px; width:32px; height:32px; border:0; border-radius:999px;
      background:rgba(255,255,255,.20); color:#fff; font-size:22px; line-height:1; cursor:pointer;
    }
    .login-head h2 { margin: 0; font-size: 22px; }
    .login-head p { margin: 6px 0 0; opacity: .86; font-size: 13px; }
    .login-body { padding: 24px 26px 26px; display: grid; gap: 14px; }
    .login-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
    .remember-login { display: inline-flex; align-items: center; gap: 8px; color: #475569; font-size: 13px; }
    .remember-login input { width: auto; min-height: auto; }
    .login-error { display: none; padding: 10px 12px; border-radius: 12px; background: #fee2e2; color: #991b1b; font-size: 13px; }
    .login-error.show { display: block; }
    .login-note { color: #64748b; font-size: 12px; line-height: 1.45; }
    .topbar-actions { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .auth-user-box { display:inline-flex; align-items:center; gap:8px; padding:7px 10px; border-radius:999px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.24); font-size:12px; }
    .auth-user-box b { font-weight:600; }
    .logout-btn { border:0; background:rgba(255,255,255,.22); color:#fff; border-radius:999px; padding:6px 10px; font-family:inherit; cursor:pointer; }
    .auth-hidden { display: none !important; }
    .dashboard-switcher {
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin:0 0 14px; padding:6px; border-radius:18px;
      background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.9);
      box-shadow:0 10px 28px rgba(15,23,42,.08);
    }
    .dashboard-tab-btn {
      border:0; border-radius:14px; padding:10px 14px; cursor:pointer;
      font-family:inherit; font-weight:800; color:#14532d; background:transparent;
      display:inline-flex; align-items:center; gap:7px;
    }
    .dashboard-tab-btn.active { background:#14532d; color:#fff; box-shadow:0 8px 18px rgba(20,83,45,.20); }
    .dashboard-page { display:none; }
    .dashboard-page[hidden] { display:none!important; }
    .dashboard-page.active { display:grid; }
    section.card.dashboard-page.active { display:block; }
    body.dashboard-clerk-active .dashboard-page-supervisor { display:none!important; }
    body.dashboard-supervisor-active .dashboard-page-clerk { display:none!important; }
    .building-dashboard-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
    .building-dashboard-note { color:#64748b; font-size:13px; line-height:1.45; }
    .building-dashboard-tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .building-dashboard-tools input { max-width:360px; }
    .building-dashboard-filter { display:flex; align-items:center; gap:6px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:6px 8px; }
    .building-dashboard-filter label { font-size:12px; color:#475569; font-weight:700; white-space:nowrap; }
    .building-dashboard-filter input, .building-dashboard-filter select { width:110px; min-height:34px; border:1px solid #cbd5e1; border-radius:9px; padding:5px 8px; font-family:inherit; }
    .building-dashboard-chart-card { margin:14px 0 16px; padding:14px; border:1px solid #e2e8f0; border-radius:16px; background:#fff; box-shadow:0 8px 22px rgba(15,23,42,.06); }
    .building-dashboard-chart-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .building-dashboard-chart-head h3 { margin:0; color:#14532d; font-size:18px; }
    .building-dashboard-chart-head small { color:#64748b; }
    .building-dashboard-chart-box { height:260px; }
    .building-dashboard-chart-box canvas { max-height:100%; }
    .building-dashboard-table .action-btn { border:0; border-radius:10px; padding:7px 10px; font-family:inherit; font-weight:800; cursor:pointer; background:#dbeafe; color:#1d4ed8; }
    .building-a1-panel { border:1px solid #bbf7d0; border-radius:16px; padding:12px; background:#f0fdf4; }
    .building-a1-panel > summary { cursor:pointer; font-weight:800; color:#14532d; margin-bottom:8px; }
    .building-a1-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
    .building-a1-grid .control.wide { grid-column:1 / -1; }
    @media (max-width:980px){ .building-dashboard-summary{grid-template-columns:repeat(2,1fr);} .building-a1-grid{grid-template-columns:1fr 1fr;} }
    @media (max-width:640px){ .building-dashboard-summary{grid-template-columns:1fr;} .building-a1-grid{grid-template-columns:1fr;} }
    .topbar {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      gap: 18px; padding: 16px 24px;
      color: white;
      background: linear-gradient(115deg, #14532d, #166534 55%, #0f766e);
      box-shadow: 0 8px 24px rgba(20,83,45,.25);
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      display: grid; place-items: center; width: 46px; height: 46px;
      border-radius: 14px; font-size: 24px;
      background: rgba(255,255,255,.17); border: 1px solid rgba(255,255,255,.22);
    }
    .brand-icon img { display:block; width:100%; height:100%; object-fit:cover; border-radius:inherit; }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1.25; }
    .brand p { margin: 2px 0 0; font-size: 12px; opacity: .82; }

    .refresh-btn {
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.14); color: white;
      border-radius: 12px; padding: 10px 14px;
      font-family: inherit; cursor: pointer;
    }

    main { width: min(1600px, 100%); margin: 0 auto; padding: 22px; }

    .filter-panel {
      display: grid;
      grid-template-columns: 2fr repeat(4, minmax(145px, 1fr)) auto;
      gap: 12px; padding: 16px; margin-bottom: 18px;
      background: var(--surface); border: 1px solid rgba(255,255,255,.8);
      border-radius: var(--radius); box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .control { display: flex; flex-direction: column; gap: 6px; }
    .control label { font-size: 12px; color: var(--muted); font-weight: 500; }
    input, select, textarea {
      width: 100%; min-height: 42px; border: 1px solid var(--line);
      border-radius: 11px; padding: 9px 12px; background: white;
      font: inherit; color: var(--text); outline: none;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }
    input:focus, select:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px rgba(34,197,94,.12); }
    .thai-date-picker-wrap {
      position: relative;
      width: 100%;
      display: block;
    }
    .thai-date-input {
      font-variant-numeric: tabular-nums;
      padding-right: 86px;
    }
    .thai-date-input::placeholder { color: #94a3b8; }
    .thai-date-calendar-btn,
    .thai-date-clear-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 32px;
      min-height: 32px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thai-date-calendar-btn {
      right: 5px;
      width: 34px;
      background: #ecfdf5;
      color: #047857;
      z-index: 6;
      pointer-events: auto;
    }
    .thai-date-picker-wrap:hover .thai-date-calendar-btn { background: #d1fae5; }
    .thai-date-clear-btn {
      right: 43px;
      width: 28px;
      background: #f1f5f9;
      color: #64748b;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease, background .12s ease, color .12s ease;
    }
    .thai-date-picker-wrap.has-value .thai-date-clear-btn {
      opacity: 1;
      pointer-events: auto;
    }
    .thai-date-clear-btn:hover {
      background: #fee2e2;
      color: #b91c1c;
    }
    .thai-date-native {
      display: none;
    }
    .thai-date-picker-wrap.picker-open { z-index: 50; }
    .thai-date-popup {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 280px;
      max-width: min(92vw, 280px);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: 0 16px 38px rgba(15, 23, 42, .18);
      padding: 10px;
      display: none;
      z-index: 60;
    }
    .thai-date-picker-wrap.picker-open .thai-date-popup { display: block; }
    .thai-date-popup-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .thai-date-popup-title {
      text-align: center;
      font-weight: 700;
      color: #0f172a;
      font-size: 15px;
      line-height: 1.2;
    }
    .thai-date-nav-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .thai-date-nav-btn,
    .thai-date-footer-btn,
    .thai-date-day-btn {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      background: #f8fafc;
      color: #0f172a;
    }
    .thai-date-nav-btn {
      width: 30px;
      min-width: 30px;
      height: 30px;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .thai-date-nav-btn:hover,
    .thai-date-footer-btn:hover,
    .thai-date-day-btn:hover { background: #e2e8f0; }
    .thai-date-weekdays,
    .thai-date-days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }
    .thai-date-weekdays {
      margin-bottom: 6px;
    }
    .thai-date-weekday {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      padding: 4px 0;
    }
    .thai-date-day-btn {
      min-height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .thai-date-day-btn.is-other-month {
      color: #94a3b8;
      background: #f8fafc;
    }
    .thai-date-day-btn.is-today {
      border-color: #10b981;
      box-shadow: inset 0 0 0 1px #10b981;
      color: #047857;
      font-weight: 700;
    }
    .thai-date-day-btn.is-selected {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 6px 14px rgba(37, 99, 235, .28);
    }
    .thai-date-popup-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .thai-date-footer-btn {
      min-height: 34px;
      padding: 7px 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
    }

    .reset-btn {
      align-self: end; height: 42px; border: 0; border-radius: 11px;
      padding: 0 16px; background: #e2e8f0; cursor: pointer; font-family: inherit;
    }

    .kpi-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 18px;
    }

    .kpi {
      position: relative; overflow: hidden;
      padding: 20px; min-height: 124px; border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow); border: 1px solid white;
    }
    .kpi::after {
      content: ""; position: absolute; right: -28px; bottom: -45px;
      width: 110px; height: 110px; border-radius: 50%; background: rgba(34,197,94,.10);
    }
    .kpi-label { color: var(--muted); font-size: 13px; }
    .kpi-value { margin-top: 8px; font-size: clamp(25px, 3vw, 35px); font-weight: 700; }
    .kpi-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .kpi > * { position: relative; z-index: 1; }
    .kpi-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .kpi-head .kpi-label { flex: 1 1 auto; }

    .dashboard-grid {
      display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, .75fr);
      gap: 18px; margin-bottom: 18px;
    }

    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid white; overflow: hidden;
    }

    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--line);
    }
    .card-head h2 { margin: 0; font-size: 16px; }
    .card-head small { color: var(--muted); }

    #map, #localRoadMap { height: 570px; background: #dbeafe; }
    #projectCoordinatePickerMap { height: 560px; background: #dbeafe; border-radius: 16px; overflow: hidden; }
    #projectCoordinateMapBackdrop { z-index: 4300; }
    #projectCoordinateMapBackdrop .entry-panel { width: min(980px, 100%); }
    .coordinate-picker-row { display: flex; gap: 8px; align-items: center; }
    .coordinate-picker-row input { flex: 1; min-width: 0; }
    .coordinate-picker-btn { padding: 10px 12px; white-space: nowrap; }
    .coordinate-picker-hint { margin-top: 6px; color: #64748b; font-size: 12px; line-height: 1.45; }
    .map-tools {
      position: absolute; z-index: 500; top: 12px; right: 12px;
      display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end;
    }
    .map-wrap { position: relative; }
    .map-wrap.map-fullscreen {
      position: fixed !important; inset: 0 !important; width:100vw !important; height:100vh !important;
      z-index: 6000; box-sizing: border-box;
      background: #fff; padding: 58px 12px 12px; border-radius: 0;
    }
    .map-wrap.map-fullscreen #map { height: calc(100vh - 70px) !important; border-radius: 14px; }
    .map-wrap.map-fullscreen .map-tools { top: 12px; right: 12px; left: 12px; }
    body.map-fullscreen-open { overflow: hidden; }
    .map-fullscreen-village-panel {
      display: none; position: absolute; z-index: 650; top: 70px; left: 22px;
      width: min(380px, calc(100% - 44px)); max-height: calc(100vh - 110px); overflow: auto;
      background: rgba(255,255,255,.97); border: 1px solid rgba(148,163,184,.45);
      border-radius: 16px; padding: 12px 14px; box-shadow: 0 16px 40px rgba(15,23,42,.20);
      backdrop-filter: blur(8px);
    }
    .map-wrap.map-fullscreen .map-fullscreen-village-panel { display: block; }
    .map-fullscreen-village-panel label { display: block; font-size: 12px; color: #475569; margin-bottom: 5px; }
    .map-fullscreen-village-panel select {
      width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 10px;
      background: white; font-family: inherit; padding: 0 9px;
    }
    .fullscreen-village-info { margin-top: 10px; font-size: 13px; color: #334155; line-height: 1.45; }
    .fullscreen-village-title { font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .fullscreen-village-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .fullscreen-village-stat { border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 9px; background: #f8fafc; }
    .fullscreen-village-stat span { display: block; color: #64748b; font-size: 11px; }
    .fullscreen-village-stat strong { display: block; margin-top: 2px; font-size: 17px; color: #0f172a; }
    .fullscreen-village-note { margin-top: 8px; color: #64748b; font-size: 12px; }
    .village-map-label {
      transform: translate(-50%, -50%);
      white-space: nowrap;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(15,23,42,.20);
      box-shadow: 0 8px 24px rgba(15,23,42,.22);
      color: #0f172a;
      font-weight: 800;
      font-size: 18px;
      line-height: 1.15;
      text-shadow: 0 1px 0 rgba(255,255,255,.9);
      pointer-events: none;
    }
    .map-print-legend { display:none; }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body.map-printing { background:#fff !important; overflow:visible !important; }
      body.map-printing > *:not(#supervisorMapWrap) { display:none !important; }
      body.map-printing #supervisorMapWrap {
        display:block !important; position:static !important; inset:auto !important;
        width:281mm !important; height:auto !important; padding:0 !important;
        margin:0 !important; background:#fff !important;
      }
      body.map-printing #supervisorMapWrap .map-tools,
      body.map-printing #supervisorMapWrap .map-fullscreen-village-panel { display:none !important; }
      body.map-printing #supervisorMapWrap #map {
        display:block !important; width:281mm !important; height:158mm !important;
        border:1px solid #94a3b8 !important; border-radius:0 !important;
      }
      body.map-printing .map-print-legend {
        display:block !important; margin-top:4mm; color:#0f172a;
        font-size:11px; line-height:1.35;
      }
      body.map-printing .map-print-title { font-size:16px; font-weight:800; text-align:center; margin-bottom:2mm; }
      body.map-printing .map-print-villages { display:grid; grid-template-columns:repeat(4,1fr); gap:1.5mm 5mm; }
      body.map-printing .village-map-label { font-size:11.5px; line-height:1; padding:2px 5px; box-shadow:none; }
      body.map-printing .leaflet-control-container { display:none !important; }
    }
    @media (max-width: 640px) {
      .map-fullscreen-village-panel { top: 98px; left: 12px; width: calc(100% - 24px); }
      .fullscreen-village-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .map-button {
      border: 1px solid var(--line); background: white;
      border-radius: 9px; padding: 8px 10px; cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 12px rgba(15,23,42,.15);
    }

    .boundary-panel {
      display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 8px; align-items: end; padding: 12px 14px;
      border-bottom: 1px solid var(--line); background: #f8fafc;
    }
    .boundary-panel .control { margin: 0; }
    .boundary-panel label { font-size: 12px; color: #475569; }
    .boundary-panel select,
    .boundary-panel input[type="color"] {
      width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 10px; background: white;
      font-family: inherit;
    }
    .boundary-panel input[type="color"] { padding: 3px; }
    .boundary-panel button {
      min-height: 38px; border: 1px solid var(--line); border-radius: 10px; background: white;
      padding: 0 10px; cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .boundary-panel button.primary { background: #16a34a; color: white; border-color: #16a34a; }
    .boundary-panel button.danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .boundary-status { grid-column: 1 / -1; color: #64748b; font-size: 12px; line-height: 1.35; }
    .boundary-status.error { color: #b91c1c; }
    .boundary-status.success { color: #15803d; }
    .boundary-vertex-marker {
      width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid currentColor;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .28); cursor: grab;
    }
    .boundary-midpoint-marker {
      width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid currentColor;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .35); display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 900; line-height: 1; color: currentColor; cursor: copy; user-select: none;
    }
    .boundary-midpoint-marker:hover { transform: scale(1.12); }
    .boundary-panel button:disabled, .boundary-panel select:disabled, .boundary-panel input:disabled { opacity: .55; cursor: not-allowed; }
    @media (max-width: 1100px) {
      .boundary-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      position:relative;z-index:2;width:min(360px,calc(100vw - 36px));padding:32px 30px 27px;text-align:center;

    .loading-brand-stage{position:relative;width:112px;height:112px;margin:0 auto 16px;display:grid;place-items:center}
    .loading-logo-shell{position:relative;z-index:3;width:66px;height:66px;padding:3px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(16,120,91,.24),0 0 0 6px rgba(255,255,255,.7);animation:loadingLogoPulse 2s ease-in-out infinite}
    .loading-logo-shell::before{content:"สก";position:absolute;inset:3px;display:grid;place-items:center;border-radius:50%;color:#157b59;background:linear-gradient(135deg,#dff7e8,#dff7f3);font-weight:900}

    .loading-spark{position:absolute;z-index:4;width:8px;height:8px;border-radius:50%;background:#32cf87;box-shadow:0 0 0 5px rgba(50,207,135,.11);animation:loadingSpark 1.7s ease-in-out infinite}
    .spark-one{top:8px;right:19px}.spark-two{left:3px;bottom:30px;animation-delay:.55s;background:#25b9ad}.spark-three{right:2px;bottom:20px;animation-delay:1.05s;width:5px;height:5px}

    .loading-progress{height:6px;margin:17px 0 12px;border-radius:999px;overflow:hidden;background:#e3f1e9;box-shadow:inset 0 1px 2px rgba(18,78,49,.08)}
    .loading-progress span{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#18a763,#18b8a8,#56d98f);animation:loadingProgress 1.45s ease-in-out infinite}
    .loading-dots{display:flex;justify-content:center;gap:6px}.loading-dots i{width:6px;height:6px;border-radius:50%;background:#87cbaa;animation:loadingDot 1.15s ease-in-out infinite}.loading-dots i:nth-child(2){animation-delay:.14s}.loading-dots i:nth-child(3){animation-delay:.28s}
    .loading-ambient{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:loadingFloat 6s ease-in-out infinite}
    .loading-ambient-one{width:260px;height:260px;left:-70px;top:-80px;background:linear-gradient(135deg,rgba(48,211,145,.28),rgba(45,212,191,.08))}
    .loading-ambient-two{width:330px;height:330px;right:-100px;bottom:-120px;background:linear-gradient(135deg,rgba(22,163,74,.08),rgba(20,184,166,.25));animation-delay:-2.4s}
    @keyframes loadingCardIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
    @keyframes loadingOrbit{to{transform:rotate(360deg)}}
    @keyframes loadingLogoPulse{50%{transform:scale(1.045);box-shadow:0 14px 34px rgba(16,120,91,.27),0 0 0 9px rgba(255,255,255,.55)}}
    @keyframes loadingSpark{50%{transform:scale(.45);opacity:.4}}

    @keyframes loadingDot{0%,100%{transform:translateY(0);opacity:.42}50%{transform:translateY(-4px);opacity:1}}
    @keyframes loadingFloat{50%{transform:translate3d(18px,-12px,0) scale(1.06)}}

    /* ===== Ribbon toolbar แบบ Microsoft Word สำหรับแก้ไขพรีวิว ===== */

    /* ===== ไม้บรรทัดแบบ Word สำหรับแก้ไขข้อความพรีวิว ===== */
    .preview-ruler-wrap {
      flex: 1 1 100%;
      width: 100%;
      display: block;
      position: relative;
      margin: 2px 0 4px;
      font-family: "Prompt", sans-serif;
      user-select: none;
      overflow: visible;
    }

    .preview-ruler-wrap.disabled {
      opacity: .55;
    }

    .preview-ruler-inner {
      width: min(100%, var(--preview-ruler-width, 170mm));
      max-width: 100%;
      display: block;
      position: relative;
      margin-left: auto;
      margin-right: auto;
    }

    .preview-ruler-caption {
      position: absolute;
      right: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: #64748b;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .preview-ruler-track {
      position: relative;
      height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background:
        linear-gradient(to right, rgba(15,23,42,.38) 0 1px, transparent 1px) 0 22px / 10% 10px repeat-x,
        linear-gradient(to right, rgba(15,23,42,.22) 0 1px, transparent 1px) 0 26px / 5% 6px repeat-x,
        linear-gradient(to bottom, #fff 0%, #f8fafc 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
      overflow: visible;
    }

    .preview-ruler-scale {
      position: absolute;
      inset: 1px 8px auto 8px;
      height: 20px;
      pointer-events: none;
    }

    .preview-ruler-label {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 10px;
      line-height: 1;
      color: #475569;
      font-weight: 800;
    }

    .preview-ruler-marker {
      position: absolute;
      z-index: 3;
      width: 0;
      height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: ew-resize;
      transform: translateX(-50%);
      touch-action: none;
    }

    .preview-ruler-wrap.disabled .preview-ruler-marker {
      pointer-events: none;
    }

    .preview-ruler-marker::before {
      content: "";
      position: absolute;
      left: 57%;
      transform: translateX(-50%);
      filter: drop-shadow(0 1px 1px rgba(15,23,42,.2));
    }

    .preview-ruler-marker.first-line {
      top: 18px;
    }

    .preview-ruler-marker.first-line::before {
      top: -1px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 9px solid #334155;
    }

    .preview-ruler-marker.hanging {
      top: 27px;
    }

    .preview-ruler-marker.hanging::before {
      top: -1px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 9px solid #334155;
    }

    .preview-ruler-marker.left-indent {
      top: 28px;
    }

    .preview-ruler-marker.left-indent::before {
      top: 8px;
      width: 13px;
      height: 6px;
      border-radius: 2px;
      background: #334155;
    }

    .preview-ruler-marker.right-indent {
      top: 18px;
    }

    .preview-ruler-marker.right-indent::before {
      top: -1px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 9px solid #64748b;
    }

    /* หมุดสีน้ำเงินแสดงตำแหน่งข้อความ/ย่อหน้าที่เคอร์เซอร์กำลังอยู่ */
    .preview-ruler-marker.active-block {
      top: 20px;
      z-index: 8;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid #ffffff;
      background: #2563eb;
      box-shadow: 0 1px 5px rgba(37,99,235,.55);
      transform: translate(-50%,-50%);
      cursor: ew-resize;
    }

    .preview-ruler-marker.active-block::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #ffffff;
      transform: translate(-50%,-50%);
      filter: none;
    }

    .preview-ruler-marker.active-block.is-hidden { display:none; }

    .preview-ruler-guide {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(14,165,233,.55);
      pointer-events: none;
      transform: translateX(-50%);
      display: none;
    }

    .preview-ruler-wrap.dragging .preview-ruler-guide {
      display: block;
    }
